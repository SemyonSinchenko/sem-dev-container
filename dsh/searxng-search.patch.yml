# Route DSH's native web_search tool through the host's SearXNG instance.
# Loaded by dsh-web-entry for run-dsh containers; `web_fetch` stays on the
# anonymous HTTP provider. See dsh/searxng-search.mjs for the provider and
# README.md for the SEARXNG_URL / SEARXNG_TIMEOUT_MS overrides.

- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: searxng
    fetchProvider: http

- insert:
    - id: searxng-search
      name: '/usr/local/share/dsh/searxng-search.mjs'
